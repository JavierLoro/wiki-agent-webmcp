services:
  wiki-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: wiki-agent-webmcp:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      OPENAI_IMPORT_MODEL: ${OPENAI_IMPORT_MODEL:-gpt-5.4-nano}
      IMPORT_MAX_MODEL_CALLS: ${IMPORT_MAX_MODEL_CALLS:-8}
      IMPORT_MAX_FILES: ${IMPORT_MAX_FILES:-15}
      IMPORT_MAX_ISSUES: ${IMPORT_MAX_ISSUES:-8}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-256000}
      IMPORT_MAX_INPUT_TOKENS: ${IMPORT_MAX_INPUT_TOKENS:-60000}
      IMPORT_MAX_OUTPUT_TOKENS: ${IMPORT_MAX_OUTPUT_TOKENS:-8000}
      IMPORT_MAX_ESTIMATED_COST: ${IMPORT_MAX_ESTIMATED_COST:-0.03}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Set APP_SESSION_SECRET in .env}
      PORT: ${PORT:-3001}
      DATABASE_PATH: ${DATABASE_PATH:-/data/wiki-agent.db}
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3001}"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
